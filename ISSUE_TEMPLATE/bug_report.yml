name: Bug report
description: Report a problem so we can fix it
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please fill in the form as completely as you can.

        **Security vulnerability?** Do not use this form. Follow our [security policy](https://github.com/azteamaz/.github/blob/main/SECURITY.md) instead.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I read the project documentation.
          required: true
        - label: I removed passwords, tokens, API keys and personal data from this report.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I do X, Y happens.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps so we can reproduce the problem.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, branch or commit hash where you see the bug.
      placeholder: e.g. v1.2.0 or a1b2c3d
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does the problem occur?
      multiple: false
      options:
        - Web interface
        - Backend / API
        - Database
        - Installation / setup
        - Documentation
        - Other
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, runtime versions (PHP, Node.js, MySQL, etc.) and device.
      placeholder: |
        - OS: Windows 11 / Ubuntu 24.04 / Android 15
        - Browser: Chrome 130
        - Runtime: Node.js 22, PHP 8.3
        - Device: Desktop / Mobile
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and error messages
      description: Paste relevant logs or error output. This will be formatted as code automatically.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images or videos here if they help explain the problem.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (workarounds, how often it happens, related issues).
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the AzTeam [Code of Conduct](https://github.com/azteamaz/.github/blob/main/CODE_OF_CONDUCT.md).
          required: true
