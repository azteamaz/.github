name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve.
        Please describe your idea as clearly as possible so we can evaluate it.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This request is about a feature, not a bug or a support question.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem are you trying to solve? Who is affected?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: false
      options:
        - Web interface / UX
        - Backend / API
        - Database
        - Performance
        - Security
        - Documentation
        - Developer experience
        - Other
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      multiple: false
      options:
        - Nice to have
        - Important
        - Critical for my use
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples from other projects, links or anything else that helps.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      multiple: false
      options:
        - "Yes, I can submit a pull request"
        - "I can help with testing or review"
        - "No, I am only suggesting the idea"
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the AzTeam [Code of Conduct](https://github.com/azteamaz/.github/blob/main/CODE_OF_CONDUCT.md).
          required: true
